{{- if .Values.validator.key.value }}
{{- include "hyperlane-bullet-validator.validate" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperlane-bullet-validator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperlane-bullet-validator.labels" . | nindent 4 }}
type: Opaque
data:
  validator-key: {{ .Values.validator.key.value | b64enc | quote }}
{{- end }}
