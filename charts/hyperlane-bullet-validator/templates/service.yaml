{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyperlane-bullet-validator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperlane-bullet-validator.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "hyperlane-bullet-validator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    - name: health
      port: {{ .Values.ports.health }}
      targetPort: health
      protocol: TCP
{{- end }}
